<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Chess Master - Versi Stabil</title>
    <!-- Menggunakan CSS & JS dari Lichess (Paling Stabil) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessground/8.0.0/chessground.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessground/8.0.0/chessground.min.js"></script>
    <style>
        body { margin: 0; background: #1e1e1e; display: flex; justify-content: center; align-items: center; height: 100vh; }
        /* Papan Chessground harus didefinisikan ukurannya */
        #myBoard { width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; }
        .cg-wrap { background: #333; }
    </style>
</head>
<body>

    <div id="myBoard"></div>

    <script>
        var game = new Chess();
        var ground = Chessground(document.getElementById('myBoard'), {
            fen: game.fen(),
            movable: {
                color: 'white',
                free: false,
                dests: toDests(game)
            }
        });

        // Konversi langkah ke format Chessground
        function toDests(game) {
            const dests = {};
            game.SQUARES.forEach(s => {
                const ms = game.moves({square: s, verbose: true});
                if (ms.length) dests[s] = ms.map(m => m.to);
            });
            return dests;
        }

        // Fungsi saat bidak digerakkan
        ground.set({
            movable: {
                events: {
                    after: (orig, dest) => {
                        game.move({from: orig, to: dest});
                        ground.set({fen: game.fen(), movable: {dests: toDests(game)}});
                    }
                }
            }
        });
    </script>
</body>
</html>
