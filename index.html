<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Master - Final</title>
    <!-- Gunakan HTTPS untuk semua resource -->
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    <style>
        :root { --bg: #1e1e1e; --panel: #2d2d2d; --accent: #4caf50; --danger: #f44336; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        #game-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        /* Papan harus punya ukuran tetap agar tidak hilang */
        #myBoard { width: 90vw; max-width: 400px; height: 90vw; max-height: 400px; }
        
        .hint-dot { width: 20%; height: 20%; background: rgba(255, 255, 0, 0.6); border-radius: 50%; position: absolute; top: 40%; left: 40%; z-index: 999; }
        .move-icon { position: absolute; top: 2px; right: 2px; font-size: 14px; font-weight: bold; color: yellow; z-index: 1000; }
        .in-check { background-color: var(--danger) !important; }
        nav { height: 70px; background: var(--panel); display: flex; justify-content: space-around; align-items: center; padding: 5px; border-top: 2px solid #3d3d3d; }
        .nav-btn { background: #3d3d3d; border: none; color: white; padding: 10px; border-radius: 8px; font-size: 10px; width: 22%; cursor: pointer; }
        .active { background: var(--accent); }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="myBoard"></div>
        <div id="status" style="margin-top:15px; font-weight: bold;">Bot: Siap</div>
    </div>

    <nav>
        <button class="nav-btn" onclick="location.reload()">Reset</button>
        <button class="nav-btn" id="analisisBtn" onclick="toggleAnalysis()">Analisis: OFF</button>
        <button class="nav-btn">Buku</button>
        <button class="nav-btn">PGN</button>
    </nav>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

    <script>
        var game = new Chess();
        var isAnalisisOn = false;
        // Pindahkan URL stockfish ke CDN yang stabil
        var stockfish = new Worker('https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js');

        function toggleAnalysis() {
            isAnalisisOn = !isAnalisisOn;
            document.getElementById('analisisBtn').innerText = "Analisis: " + (isAnalisisOn ? "ON" : "OFF");
            document.getElementById('analisisBtn').classList.toggle('active');
        }

        function showHints(square) {
            var moves = game.moves({ square: square, verbose: true });
            moves.forEach(m => $('.square-' + m.to).append('<div class="hint-dot"></div>'));
        }

        function onDrop(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return 'snapback';
            
            $('.hint-dot').remove();
            board.position(game.fen());

            if (isAnalisisOn) {
                $('.square-' + target).append('<div class="move-icon">▲</div>');
            }

            setTimeout(function() {
                stockfish.postMessage('position fen ' + game.fen());
                stockfish.postMessage('go depth 10');
            }, 250);
        }

        stockfish.onmessage = function(e) {
            if (e.data.startsWith('bestmove')) {
                var move = e.data.split(' ')[1];
                game.move({ from: move.substring(0,2), to: move.substring(2,4), promotion: 'q' });
                board.position(game.fen());
            }
        };

        var board = Chessboard('myBoard', {
            draggable: true,
            position: 'start',
            onDragStart: function(s, p) { showHints(s); },
            onDrop: onDrop,
            // PATH ABSOLUT HTTPS AGAR TIDAK DIBLOKIR GITHUB
            pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
            snapSpeed: 0, moveSpeed: 0
        });
    </script>
</body>
</html>
