<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess Board</title>
    <style>
        body { background: #1e1e1e; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); width: 90vw; height: 90vw; max-width: 400px; max-height: 400px; border: 5px solid #333; }
        .square { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 30px; }
        .white { background-color: #f0d9b5; }
        .black { background-color: #b58863; }
    </style>
</head>
<body>

    <div class="board" id="board"></div>

    <script>
        const board = document.getElementById('board');
        const pieces = {
            r: '♜', n: '♞', b: '♝', q: '♛', k: '♚', p: '♟',
            R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔', P: '♙'
        };
        const initial = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],['','','','','','','',''],
            ['','','','','','','',''],['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const sq = document.createElement('div');
                sq.className = 'square ' + ((r + c) % 2 === 0 ? 'white' : 'black');
                sq.innerText = pieces[initial[r][c]] || '';
                board.appendChild(sq);
            }
        }
    </script>
</body>
</html>
